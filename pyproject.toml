[project]
name = "geostart"
version = "0.1.0"
description = "Оценка окупаемости офлайн-точки малого бизнеса по месту"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "geopandas>=1.0",
    "h3>=4.1,<5",
    "httpx>=0.27",
    "numpy>=2.0",
    "osmium>=4.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=17.0",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geostart"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ERA", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
