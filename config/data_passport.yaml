sources:
  - code: osm
    name: OpenStreetMap, выгрузки Geofabrik по федеральным округам
    owner: участники OpenStreetMap, раздача Geofabrik GmbH
    url: https://download.geofabrik.de/russia.html
    license: Open Database License 1.0, подпись «© участники OpenStreetMap» на карте и в отчёте, производная база распространяется на тех же условиях
    content: здания с типом и этажностью, точки интереса, остановки, входы в метро, административные границы, МКАД, адреса, конкуренты всех ниш
    files: [hex_features.parquet, competitors.parquet, addresses.parquet, boundary.geojson]
    version: дата выгрузки в имени файла и в блоке osm_extracts файла config/pipeline.yaml
    update: новая выгрузка подключается заменой url, file и date в config/pipeline.yaml, затем `python -m geostart.release rebuild --city <город>`
    frequency: Geofabrik обновляет выгрузки ежедневно, сервис закрепляет дату выгрузки и обновляет её перед выпуском версии данных
  - code: mos_ru_catering
    name: Портал открытых данных Москвы, набор 1903 «Общественное питание в Москве»
    owner: Департамент торговли и услуг города Москвы
    url: https://data.mos.ru/opendata/1903
    license: открытые данные по постановлению Правительства РФ № 583 от 10.07.2013, повторное использование со ссылкой на портал
    content: кофейни с сетью и числом посадочных мест
    files: [competitors.parquet]
    version: версия файла в блоке mos_ru_catering файла config/pipeline.yaml
    update: новая версия подключается заменой url, file и date в блоке mos_ru_catering, затем `python -m geostart.release rebuild --city moscow`
    frequency: портал публикует новую версию набора примерно раз в неделю
  - code: trudvsem
    name: Открытое API портала «Работа России»
    owner: оператор портала «Работа России»
    url: https://opendata.trudvsem.ru/api/v1/vacancies
    license: условия повторного использования на портале не указаны, сервис хранит только агрегаты зарплат по профессии без работодателей и контактов
    content: медиана и квартили зарплат в вакансиях по профессиям ниш
    files: [wages.parquet]
    version: дата сбора в поле collected_at файла wages.parquet
    update: "`python -m geostart.pipeline wages --city <город>` или пересчёт города без --skip-wages"
    frequency: вакансии меняются ежедневно, зарплаты обновляются перед выпуском версии данных
  - code: population
    name: Численность населения
    owner: Росстат и территориальные органы статистики, часть чисел взята из публикаций СМИ и сводок со ссылкой на Росстат, для районов Москвы сводка Википедии
    url: ссылки по каждому городу в разделе «Покрытие и версии»
    license: официальная статистика, общедоступная информация
    content: численность населения города и региона для калибровки жителей ячеек
    files: [hex_features.parquet]
    version: дата оценки численности в config/pipeline.yaml
    update: новые числа записываются в population_region и population_scope файла config/pipeline.yaml, затем пересчёт города
    frequency: Росстат публикует оценку численности раз в год
  - code: research
    name: Исследование команды
    owner: команда Simply Lovely
    url: каталог research/ репозитория
    license: собственные материалы команды, у каждого числа указан открытый источник
    content: параметры ниш, ставки аренды по выборкам объявлений Циан, налоги 2026 года, кредитные продукты, нормативы финансовой модели
    files: [research/niche_params/*.yaml, research/rent/*.csv, research/taxes/2026.yaml, research/credit/products.yaml, research/economics/norms.yaml]
    version: дата в поле date или source каждой записи, история в git
    update: правка файла в research/, затем `python -m geostart.release rebuild --city all --skip-pipeline`
    frequency: перед выпуском версии и при изменении налогов или условий кредитов
  - code: basemap
    name: Подложка карты Protomaps
    owner: Protomaps, данные участников OpenStreetMap
    url: https://maps.protomaps.com/builds/
    license: Open Database License 1.0 для данных, подпись «Protomaps © участники OpenStreetMap»
    content: векторные тайлы z0-14 по прямоугольникам шести городов
    files: [basemap/geostart.pmtiles]
    version: номер сборки в метаданных файла и в scripts/basemap_extract.py
    update: "`python scripts/basemap_extract.py` с новой сборкой в BUILD"
    frequency: при подключении нового города или раз в полгода
  - code: geoplatform_stub
    name: Заглушка геоплатформы банка
    owner: команда Simply Lovely
    url: scripts/geoplatform_demo.py
    license: синтетические данные, не описывают реальные траты
    content: траты по квадратам 500×500 м для демонстрации подключения данных банка
    files: [geoplatform/*]
    version: дата генерации
    update: "`python scripts/geoplatform_demo.py`"
    frequency: по необходимости для демонстрации
