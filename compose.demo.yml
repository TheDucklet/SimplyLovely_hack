name: geostart-demo

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_MAP_STYLE_URL: ${GEOSTART_MAP_STYLE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GEOSTART_DEMO_PORT:-8080}:80"
    restart: unless-stopped
