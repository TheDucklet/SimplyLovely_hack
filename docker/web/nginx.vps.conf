map $http_cf_connecting_ip $client_key {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $client_key zone=api_client:10m rate=10r/s;
limit_req_zone $client_key zone=report_client:10m rate=2r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1000;

    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_key;
    proxy_set_header X-Real-IP $client_key;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;

    location = /api/v1/report {
        limit_req zone=report_client burst=20 nodelay;
        proxy_pass http://api:8000;
    }

    location /api/ {
        limit_req zone=api_client burst=60 nodelay;
        proxy_pass http://api:8000;
    }

    location ~* \.mjs$ {
        types {}
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
