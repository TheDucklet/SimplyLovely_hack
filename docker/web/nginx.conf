server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript application/x-protobuf text/css image/svg+xml;
    gzip_min_length 1000;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /basemap/tiles/ {
        proxy_pass http://tiles:8080/;
        proxy_hide_header Access-Control-Allow-Origin;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /basemap/fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /basemap/fonts/empty.pbf;
    }

    location = /basemap/style.json {
        add_header Cache-Control "no-cache";
    }

    location ~* \.mjs$ {
        types {}
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
