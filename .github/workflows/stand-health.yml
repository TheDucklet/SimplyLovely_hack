name: Public stand health

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.GEOSTART_PUBLIC_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GEOSTART_PUBLIC_URL: ${{ vars.GEOSTART_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_stand.py --url "$GEOSTART_PUBLIC_URL" --json
